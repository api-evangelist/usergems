description: >-
  Cross-cutting standards conformance for UserGems. The REST API conforms to very
  little beyond plain HTTP+JSON; the interesting conformance lives on the MCP
  side, where UserGems implements the current OAuth discovery stack correctly —
  RFC 8414 authorization-server metadata, RFC 9728 protected-resource metadata
  with a WWW-Authenticate challenge, RFC 7591 dynamic client registration and
  PKCE S256. Compliance certifications are published separately and are recorded
  in security/usergems-trust-center.yml.
standards:
  - id: oauth2
    conforms: true
    evidence: >-
      authorization_code + refresh_token grants advertised at
      https://app.usergems.com/.well-known/oauth-authorization-server
    scope: MCP server only
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: 200 JSON document with issuer, authorization/token/registration endpoints
  - id: rfc9728-oauth-protected-resource-metadata
    conforms: true
    evidence: >-
      200 JSON at /.well-known/oauth-protected-resource, and a 401 challenge
      carrying WWW-Authenticate: Bearer realm="mcp", resource_metadata="…"
  - id: rfc7591-dynamic-client-registration
    conforms: true
    evidence: registration_endpoint https://app.usergems.com/mcp/oauth/register
  - id: rfc7636-pkce
    conforms: true
    evidence: code_challenge_methods_supported ["S256"]
  - id: mcp
    conforms: true
    evidence: >-
      Hosted remote MCP server at https://app.usergems.com/mcp/usergems, JSON-RPC
      over HTTP, documented for Claude and ChatGPT clients
