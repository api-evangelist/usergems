- aid: usergems:usergems-mcp
  name: UserGems MCP
  description: >-
    Hosted remote MCP server that lets an agent in Claude, ChatGPT or any
    MCP-compatible client work against the customer's own UserGems workspace —
    searching accounts and prospects, pulling signal and score history, running
    account research, drafting Gem-E messages, and building, editing and running
    campaigns including CRM writes, sequence enrollment and ad-audience sync.
    OAuth 2.0 with dynamic client registration, PKCE S256 and a single mcp:use
    scope delegating the signed-in user's own UserGems permissions. In gated
    early access as of August 2026.
  humanURL: https://www.usergems.com/product/mcp
