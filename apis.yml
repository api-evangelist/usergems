aid: usergems
url: https://raw.githubusercontent.com/api-evangelist/usergems/refs/heads/main/apis.yml
name: UserGems
description: >-
  UserGems is a San Francisco-based sales intelligence platform that tracks champion job changes and surfaces buying
  signals so sales and marketing teams can prioritize outbound and ABM motions. The platform packages 30+ native signals
  (job changes, contact-level intent, M&A, hiring, web visits), Gem-E AI agents for prospect list building and email
  personalization, and custom AI scoring trained on 600+ closed-won patterns. UserGems exposes a public REST API at
  api.usergems.com/v1 that lets customers programmatically add and remove contacts to track for job changes, add and
  remove target accounts, and honor data-subject deletion requests. That API is deliberately write-only — there are no
  read or GET endpoints — authenticates with a single company-wide X-Api-Key header, is capped at 20 requests per second
  with one record per request, and acknowledges enqueueing rather than completion. UserGems also ships a hosted remote
  MCP server at app.usergems.com/mcp/usergems, in gated early access as of August 2026, that lets agents in Claude or
  ChatGPT search accounts and prospects, pull signal and score history, run research, draft Gem-E messages, and build and
  run campaigns including CRM writes, sequence enrollment and ad-audience sync — authorized with OAuth 2.0, dynamic
  client registration, PKCE S256 and a single mcp:use scope. Native integrations include Salesforce, HubSpot, Microsoft
  Dynamics, Outreach, Salesloft, Gong Engage, Marketo, LinkedIn Ads, Meta Ads, and Google Ads.
