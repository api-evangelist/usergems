cardinality_notes:
  - >-
    Delete scoping is the clearest evidence of cardinality: DELETE /contact takes
    optional relationshipType and signal, and leaving both out removes the
    contact from every relationship type and every signal. So one email may be
    tracked under many (relationshipType, signal) combinations simultaneously.
gaps:
  - No read operations, so the graph cannot be traversed through the API.
  - No UserGems-issued identifiers are returned on any response.
  - No id prefixes or resource URIs to document.
  - No schema published for the outbound webhook payload, so the egress shape of these entities is unknown.
